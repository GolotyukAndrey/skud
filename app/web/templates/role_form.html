{% extends "base.html" %}
{% block title %}Роль | СКУД{% endblock %}

{% block content %}
<div class="mb-3">
  <h4 class="mb-0">{% if role %}Редактировать роль{% else %}Новая роль{% endif %}</h4>
</div>

<div class="card p-4">
  <form method="post">
    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <label class="form-label">Название роли</label>
        <input class="form-control" name="name"
               value="{{ role.name if role else '' }}" placeholder="Например: Сотрудник">
      </div>

      <div class="col-12">
        <label class="form-label">Описание</label>
        <textarea class="form-control" rows="3" name="description"
                  placeholder="Опционально">{{ role.description if role and role.description else '' }}</textarea>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('roles.list') }}">Отмена</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
